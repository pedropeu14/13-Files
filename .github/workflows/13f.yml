name: Atualizar 13F (carteiras + dashboard)

on:
  schedule:
    # Só duas rodadas por trimestre, nos meses de divulgação (fev/mai/ago/nov).
    # Horários em UTC; a SEC recebe filings no horário de Nova York.
    #
    # Dia 14, 21:00 UTC = 23h em Zurique = 17h em NY — depois do fechamento,
    # quando a maioria dos grandes gestores já arquivou no dia do prazo.
    - cron: "0 21 14 2,5,8,11 *"
    # Dia 15, 13:00 UTC = 15h em Zurique = 9h em NY — pega quem arquivou tarde
    # da noite do dia 14.
    - cron: "0 13 15 2,5,8,11 *"
    #
    # Ambos ficam a 1h+ do radar.yml (11:00 e 22:00 UTC) para os dois não
    # tentarem dar push ao mesmo tempo.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 13f-update
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar SEC EDGAR, analisar e gerar o dashboard
        env:
          # A SEC exige User-Agent identificável. Defina o secret SEC_USER_AGENT
          # como "Nome Sobrenome email@dominio.com" para não usar o padrão.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Pedro Amorim pedrof.amorim@gmail.com (13F research)' }}
        run: python 13f_search.py all

      - name: Resumo da rodada
        if: always()
        run: |
          if [ -f data/meta/_run.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("data/meta/_run.json"))
          print(f"## Trimestre {r['latest_period']}\n")
          print(f"- Arquivaram: **{len(r['reported_latest'])}/{r['n_managers']}**")
          if r["missing_latest"]:
              print(f"- Sem filing: {', '.join(r['missing_latest'])}")
          for e in r["errors"]:
              print(f"- FALHA `{e['slug']}`: {e['error']}")
          PY
          fi

      - name: Commitar se mudou (o push republica o Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 13f_dashboard.html data
          git diff --cached --quiet || git commit -m "13f: atualiza carteiras $(date -u +%F)"
          git push
