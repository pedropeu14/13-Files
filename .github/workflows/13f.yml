name: Atualizar 13F (carteiras + dashboard)

on:
  schedule:
    # Janela do prazo nos meses de divulgação (fev/mai/ago/nov), do dia 14 ao 20.
    #
    # Por que uma faixa e não dias fixos: o prazo do 13F é de 45 dias corridos
    # após o fim do trimestre (14/fev, 15/mai, 14/ago, 14/nov), MAS rola para o
    # próximo dia útil quando cai em fim de semana ou feriado. Em nov/2026 o dia
    # 14 caiu num sábado e o prazo real foi segunda, 16 — as rodadas fixas de 14
    # e 15 pegaram só 15 de 55 gestores. Os próximos quatro prazos também rolam:
    #   4T26 -> ter 16/02/2027 (14 é domingo, 15 é Presidents' Day)
    #   1T27 -> seg 17/05/2027 (15 é sábado)
    #   2T27 -> seg 16/08/2027 (14 é sábado)
    #   3T27 -> seg 15/11/2027 (14 é domingo)
    #
    # Rodar todo dia da faixa não gera ruído: o passo de commit só commita se
    # algo mudou, então nos dias sem filing novo a rodada termina sem commit.
    #
    # 21:00 UTC = 17h em NY, depois do fechamento — pega quem arquivou no dia.
    - cron: "0 21 14-20 2,5,8,11 *"
    # 13:00 UTC = 9h em NY — pega quem arquivou de madrugada.
    - cron: "0 13 14-20 2,5,8,11 *"
    #
    # Ambos ficam a 1h+ do radar.yml (11:00 e 22:00 UTC) para os dois não
    # tentarem dar push ao mesmo tempo.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 13f-update
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar SEC EDGAR, analisar e gerar o dashboard
        env:
          # A SEC exige User-Agent identificável. Defina o secret SEC_USER_AGENT
          # como "Nome Sobrenome email@dominio.com" para não usar o padrão.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Pedro Amorim pedrof.amorim@gmail.com (13F research)' }}
        run: python 13f_search.py all

      - name: Regenerar a planilha 13F_analise.xlsx
        run: |
          pip install --quiet openpyxl
          python make_excel.py

      - name: Resumo da rodada
        if: always()
        run: |
          if [ -f data/meta/_run.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("data/meta/_run.json"))
          print(f"## Trimestre {r['latest_period']}\n")
          print(f"- Arquivaram: **{len(r['reported_latest'])}/{r['n_managers']}**")
          if r["missing_latest"]:
              print(f"- Sem filing: {', '.join(r['missing_latest'])}")
          for e in r["errors"]:
              print(f"- FALHA `{e['slug']}`: {e['error']}")
          PY
          fi

      - name: Commitar se mudou (o push republica o Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 13f_dashboard.html 13F_analise.xlsx data
          git diff --cached --quiet || git commit -m "13f: atualiza carteiras $(date -u +%F)"
          git push
